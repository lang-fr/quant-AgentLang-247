name: AGENT QUANT LANG 24/7 Scheduled Report

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 WIB (Sesi Asia)
    - cron: "0 7 * * *"   # 14:00 WIB (London Killzone)
    - cron: "0 12 * * *"  # 19:00 WIB (New York Killzone)
  workflow_dispatch:

jobs:
  run-quant-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Institutional Report & Audit Gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_REASONING_EFFORT: ${{ vars.GEMINI_REASONING_EFFORT }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_REASONING_EFFORT: ${{ vars.ANTHROPIC_REASONING_EFFORT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
          RUN_MODE: "report"
        run: python main.py --report
