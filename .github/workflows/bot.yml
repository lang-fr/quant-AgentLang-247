name: Run Quant Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Jalankan Verifier dan AI Quant Bot
        env:
          RUN_MODE: GITHUB_ACTIONS
          BINANCE_DEMO_MODE: "true"
          AUTO_EXECUTE_BINANCE: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOCKWORKS_API_KEY: ${{ secrets.BLOCKWORKS_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        run: |
          python outcome_verifier.py
          python main.py
      - name: Simpan Database Audit SQLite ke Repo
        if: always()
        run: |
          if [ -f "quant_cloud_audit.db" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add quant_cloud_audit.db
            git diff --staged --quiet || git commit -m "chore: update quant_cloud_audit.db [skip ci]"
            git push
          fi
